# App version of the next release. To publish: change versionName, write release/notes.md,
# commit, then push the tag "v<versionName>" (the GitHub release workflow does the rest).
# versionCode is derived: major * 10000 + minor * 100 + patch (1.2.3 -> 10203).
versionName=1.1.0
# true = installed versions older than this one must update (the dialog has no "Depois").
forceUpdate=false
